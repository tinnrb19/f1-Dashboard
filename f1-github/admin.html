<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>F1 Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0D12; --panel:#151922; --panel2:#1B2130; --line:#2A3140; --text:#E8EAED; --muted:#8B92A0;
         --yellow:#F5B700; --green:#4ADE80; --red:#F87171; --blue:#60A5FA; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Space Mono',monospace; font-size:13px; line-height:1.55; }
  h1,h2,h3,.brand{ font-family:'Oswald',sans-serif; margin:0; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  .hidden{ display:none !important; }

  /* login */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  .login-card .brand{ font-size:26px; margin-bottom:4px; }
  .login-card .sub{ color:var(--muted); font-size:12px; margin-bottom:20px; }

  /* shell */
  header.bar{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:12px 20px; background:rgba(11,13,18,.88);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header.bar .brand{ font-size:20px; } header.bar .brand b{ color:var(--yellow); }
  .who{ margin-left:auto; color:var(--muted); font-size:12px; display:flex; gap:10px; align-items:center; }
  nav.tabs{ display:flex; gap:4px; padding:10px 20px 0; border-bottom:1px solid var(--line); overflow-x:auto; }
  nav.tabs button{ background:none; border:none; border-bottom:2px solid transparent; padding:9px 14px; color:var(--muted); cursor:pointer; white-space:nowrap; font-family:'Oswald',sans-serif; font-size:14px; }
  nav.tabs button.on{ color:var(--yellow); border-bottom-color:var(--yellow); }
  main{ max-width:1000px; margin:0 auto; padding:20px; }

  /* ui */
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h2{ font-size:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .card h2 small{ color:var(--muted); font-family:'Space Mono',monospace; font-size:11px; font-weight:400; }
  label{ display:block; color:var(--muted); font-size:11px; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.4px; }
  input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:9px 11px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--yellow); }
  textarea{ min-height:90px; resize:vertical; }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media(max-width:640px){ .row{ grid-template-columns:1fr; } }
  .btn{ background:var(--yellow); color:#14110A; border:none; border-radius:8px; padding:9px 16px; font-weight:700; cursor:pointer; margin-top:14px; }
  .btn:hover{ filter:brightness(1.08); } .btn:disabled{ opacity:.5; cursor:wait; }
  .btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--line); }
  .btn.danger{ background:transparent; color:var(--red); border:1px solid rgba(248,113,113,.4); }
  .btn.sm{ padding:5px 10px; margin:0; font-size:12px; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .check{ display:flex; align-items:center; gap:8px; margin:8px 0; color:var(--text); text-transform:none; letter-spacing:0; font-size:13px; }
  .check input{ width:auto; }
  .grid4{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .v{ font-family:'Oswald',sans-serif; font-size:28px; font-weight:700; color:var(--yellow); }
  .stat .l{ color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.4px; }
  table{ width:100%; border-collapse:collapse; } th{ text-align:left; color:var(--muted); font-weight:400; font-size:11px; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; } tr:last-child td{ border-bottom:none; }
  .num{ text-align:right; }
  .muted{ color:var(--muted); } .err{ color:var(--red); } .ok{ color:var(--green); }
  .pill{ display:inline-block; padding:1px 8px; border-radius:20px; font-size:11px; border:1px solid var(--line); color:var(--muted); }
  .pill.on{ color:var(--green); border-color:rgba(74,222,128,.4); }
  .chart{ display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:8px; }
  .chart .col{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; min-width:0; }
  .chart .bar{ width:100%; background:linear-gradient(180deg,var(--yellow),#c98f00); border-radius:4px 4px 0 0; min-height:2px; }
  .chart .d{ font-size:9px; color:var(--muted); margin-top:4px; white-space:nowrap; }
  pre.raw{ background:#0A0C11; border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; max-height:560px; font-size:12px; margin:0; }
  #toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line); padding:10px 18px; border-radius:24px; z-index:50; }
  #toast.bad{ border-color:var(--red); color:var(--red); } #toast.good{ border-color:var(--green); }
  .news-row .t{ font-weight:700; } .news-row .b{ color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hidden"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
